<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Survey Form - Bootstrap</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .form-wrapper {
      max-width: 600px;
      border: 2px solid #5a82b5;
    }
    .teal-heading {
      color: #1e8489;
    }

    .logo-placeholder {
      width: 120px;
      height: 120px;
      background-color: #f0f0f0;
      border: 2px solid #203e8a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .logo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
  </style>
</head>
<body>

<div class="container my-4 p-4 form-wrapper bg-white">

  <div class="logo-placeholder mb-4 text-center">
    <img src="./assets/IUlogo.png" alt="Logo" class="logo-img" loading="lazy">
  </div>

  <h1 class="teal-heading mb-2">Survey</h1>
  <p class="mb-4">If you have a moment, we'd appreciate it if you would fill out this survey.</p>

  <form action="#" method="POST">

    <h4 class="teal-heading mb-3">Your information:</h4>

    <div class="row mb-2 align-items-center">
      <div class="col-4">
        <label for="firstName" class="col-form-label fw-bold">First Name</label>
      </div>
      <div class="col-8">
        <input type="text" id="firstName" name="firstName" class="form-control form-control-sm">
      </div>
    </div>

    <div class="row mb-2 align-items-center">
      <div class="col-4">
        <label for="lastName" class="col-form-label fw-bold">Last Name</label>
      </div>
      <div class="col-8">
        <input type="text" id="lastName" name="lastName" class="form-control form-control-sm">
      </div>
    </div>

    <div class="row mb-2 align-items-center">
      <div class="col-4">
        <label for="email" class="col-form-label fw-bold">Email</label>
      </div>
      <div class="col-8">
        <input type="email" id="email" name="email" class="form-control form-control-sm">
      </div>
    </div>

    <div class="row mb-4 align-items-center">
      <div class="col-4">
        <label for="dob" class="col-form-label fw-bold">Date of Birth</label>
      </div>
      <div class="col-8">
        <input type="date" id="dob" name="dob" class="form-control form-control-sm">
      </div>
    </div>

    <h5 class="teal-heading mb-3">How did you hear about us?</h5>

    <div class="mb-4">
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="source" id="searchEngine" value="search_engine" checked>
        <label class="form-check-label" for="searchEngine">Search engine</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="source" id="wordOfMouth" value="word_of_mouth">
        <label class="form-check-label" for="wordOfMouth">Word of mouth</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="source" id="socialMedia" value="social_media">
        <label class="form-check-label" for="socialMedia">Social Media</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="source" id="other" value="other">
        <label class="form-check-label" for="other">Other</label>
      </div>
    </div>

    <h5 class="teal-heading mb-3">Would you like to receive announcements about new CDs and special offers?</h5>

    <div class="mb-4">
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="announceYes" name="announce_general">
        <label class="form-check-label" for="announceYes">YES, I'd like that.</label>
      </div>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="announceEmail" name="announce_email">
        <label class="form-check-label" for="announceEmail">YES, please send me email announcements.</label>
      </div>
    </div>

    <div class="mb-4 d-flex align-items-center">
      <label for="contactMethod" class="me-2">Please contact me by:</label>
      <select id="contactMethod" name="contactMethod" class="form-select form-select-sm w-auto">
        <option value="email_or_postal">Email or postal mail</option>
        <option value="email_only">Email only</option>
        <option value="postal_only">Postal mail only</option>
      </select>
    </div>

    <button type="submit" class="btn btn-light border border-secondary px-4">Submit</button>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
